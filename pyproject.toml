[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sarcastone"
version = "0.1.0"
description = "Multimodal (text + speech) sarcasm detection on MUStARD++"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "torch",
    "transformers",
    "tqdm",
    # phase 2: audio
    "librosa",
    "soundfile",
    "praat-parselmouth",
    "imageio-ffmpeg",
    # custom dataset collection
    "yt-dlp",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
